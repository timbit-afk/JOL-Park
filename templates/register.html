{% load static %}

<!DOCTYPE html>

<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Регистрация — JOL Park</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 20px;

        background:
            radial-gradient(
                circle at 20% 20%,
                rgba(37, 99, 235, 0.18),
                transparent 35%
            ),
            radial-gradient(
                circle at 80% 80%,
                rgba(14, 165, 233, 0.12),
                transparent 35%
            ),
            #07111f;

        color: white;
    }

    .container {
        width: 100%;
        max-width: 420px;

        animation: show 0.5s ease;
    }

    @keyframes show {
        from {
            opacity: 0;
            transform: translateY(20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* LOGO */

    .logo {
        text-align: center;
        margin-bottom: 25px;
    }

    .logo-icon {
        width: 62px;
        height: 62px;

        margin: 0 auto 12px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 18px;

        font-size: 30px;

        background: linear-gradient(
            135deg,
            #2563eb,
            #0ea5e9
        );

        box-shadow:
            0 15px 35px rgba(37, 99, 235, 0.3);
    }

    .logo h1 {
        font-size: 30px;
        font-weight: 800;
    }

    .logo p {
        margin-top: 5px;
        color: #8fa3b8;
        font-size: 14px;
    }

    /* CARD */

    .card {
        padding: 30px;

        border-radius: 24px;

        background: rgba(15, 28, 45, 0.9);

        border: 1px solid rgba(255, 255, 255, 0.08);

        box-shadow:
            0 25px 70px rgba(0, 0, 0, 0.35);

        backdrop-filter: blur(15px);
    }

    .card h2 {
        text-align: center;
        font-size: 24px;
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #8fa3b8;
        font-size: 14px;
        margin-bottom: 25px;
    }

    /* ERRORS */

    .messages {
        margin-bottom: 18px;
    }

    .message {
        padding: 11px 13px;

        border-radius: 10px;

        background: rgba(239, 68, 68, 0.1);

        border: 1px solid rgba(239, 68, 68, 0.25);

        color: #fca5a5;

        font-size: 13px;

        margin-bottom: 8px;
    }

    /* FORM */

    .form-group {
        margin-bottom: 17px;
    }

    .form-group label {
        display: block;

        margin-bottom: 8px;

        color: #cbd5e1;

        font-size: 13px;

        font-weight: 600;
    }

    .input-wrapper {
        position: relative;
    }

    .icon {
        position: absolute;

        left: 15px;
        top: 50%;

        transform: translateY(-50%);

        font-size: 17px;

        opacity: 0.7;
    }

    input {
        width: 100%;
        height: 50px;

        padding: 0 15px 0 45px;

        border-radius: 13px;

        border: 1px solid rgba(255, 255, 255, 0.1);

        background: rgba(255, 255, 255, 0.05);

        color: white;

        outline: none;

        font-size: 15px;

        transition: 0.2s;
    }

    input::placeholder {
        color: #68798c;
    }

    input:focus {
        border-color: #3b82f6;

        background: rgba(59, 130, 246, 0.08);

        box-shadow:
            0 0 0 4px rgba(59, 130, 246, 0.1);
    }

    /* BUTTON */

    button {
        width: 100%;
        height: 52px;

        margin-top: 5px;

        border: none;
        border-radius: 13px;

        background: linear-gradient(
            135deg,
            #2563eb,
            #0ea5e9
        );

        color: white;

        font-size: 15px;
        font-weight: 700;

        cursor: pointer;

        transition: 0.2s;

        box-shadow:
            0 12px 25px rgba(37, 99, 235, 0.25);
    }

    button:hover {
        transform: translateY(-2px);

        box-shadow:
            0 16px 32px rgba(37, 99, 235, 0.35);
    }

    button:active {
        transform: translateY(0);
    }

    /* LOGIN */

    .login {
        text-align: center;

        margin-top: 22px;

        color: #8fa3b8;

        font-size: 14px;
    }

    .login a {
        color: #60a5fa;

        text-decoration: none;

        font-weight: 700;
    }

    .login a:hover {
        color: #93c5fd;
    }

    /* MOBILE */

    @media (max-width: 480px) {

        body {
            padding: 15px;
        }

        .card {
            padding: 25px 20px;
            border-radius: 20px;
        }

        .logo h1 {
            font-size: 27px;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            font-size: 27px;
        }
    }
</style>


</head>

<body>

<div class="container">


<!-- LOGO -->

<div class="logo">

    <div class="logo-icon">
        🚗
    </div>

    <h1>JOL Park</h1>

    <p>Умная парковка в Бишкеке</p>

</div>


<!-- REGISTRATION CARD -->

<div class="card">

    <h2>Создать аккаунт</h2>

    <p class="subtitle">
        Зарегистрируйтесь, чтобы бронировать парковку
    </p>


    <!-- DJANGO MESSAGES -->

    {% if messages %}

        <div class="messages">

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        </div>

    {% endif %}


    <!-- FORM -->

    <form method="POST">

        {% csrf_token %}


        <!-- USERNAME -->

        <div class="form-group">

            <label for="username">
                Имя пользователя
            </label>

            <div class="input-wrapper">

                <span class="icon">👤</span>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Введите имя пользователя"
                    autocomplete="username"
                    required
                >

            </div>

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Пароль
            </label>

            <div class="input-wrapper">

                <span class="icon">🔒</span>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Введите пароль"
                    autocomplete="new-password"
                    required
                >

            </div>

        </div>


        <!-- PASSWORD CONFIRM -->

        <div class="form-group">

            <label for="password2">
                Повторите пароль
            </label>

            <div class="input-wrapper">

                <span class="icon">🔐</span>

                <input
                    type="password"
                    id="password2"
                    name="password2"
                    placeholder="Повторите пароль"
                    autocomplete="new-password"
                    required
                >

            </div>

        </div>


        <button type="submit">
            Создать аккаунт
        </button>

    </form>


    <!-- LOGIN LINK -->

    <div class="login">

        Уже есть аккаунт?

        <a href="{% url 'login' %}">
            Войти
        </a>

    </div>

</div>


</div>

</body>
</html>
